name: Сборка и публикация на GitHub Pages

# В форке прод-деплой только вручную: иначе он затирает превью ветки preview.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Сайт отдаётся с корня домена ликсианг.рф (в punycode — так требуют
      # GitHub Pages и браузеры), поэтому префикс подпапки больше не нужен.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://xn--80agnajes3a.xn--p1ai
      # Админка собирается из готовых страниц сайта, строго после сборки Astro.
      - name: Собрать админку из готовых страниц
        run: python3 admin/build.py dist
        env:
          SITE_URL: https://xn--80agnajes3a.xn--p1ai
      - name: Запретить Jekyll обрабатывать сборку
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
