name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://tema-mail.github.io/evolution-car-by
      # Админка собирается из готовых страниц сайта, поэтому строго после
      # сборки Astro и до префикса: rebase-dist проставит его и в админке.
      - name: Собрать админку из готовых страниц
        run: python3 admin/build.py dist
      - name: Проставить префикс подпапки GitHub Pages
        run: node scripts/rebase-dist.mjs /evolution-car-by
      - name: Запретить Jekyll обрабатывать сборку
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
